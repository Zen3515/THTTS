[project]
name = "thtts"
version = "0.2.0"
description = "tts via wyoming for Thai"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cached-path",
    "f5-tts",
    "langdetect>=1.0.9",
    "numpy>=1.26.4",
    "phonemizer>=3.3.0",
    "pythainlp>=5.1.2",
    "python-crfsuite>=0.9.11",
    "pyyaml>=6.0",
    "ssg>=0.0.8",
    "syllapy>=0.7.2",
    "tltk>=1.9.1",
    "torch>=2.8.0",
    "torchaudio",
    "tqdm>=4.67.1",
    "transformers>=4.55.2",
    "uvloop>=0.21.0",
    "wyoming>=1.8,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
]

[project.scripts]
thtts = "thtts.__main__:run"
thtts-healthcheck = "thtts.healthcheck:run"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["thtts*", "util*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires explicitly enabled model artifacts and optional hardware",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
